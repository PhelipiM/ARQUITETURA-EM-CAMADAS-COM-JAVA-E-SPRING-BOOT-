<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Chamado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm p-4 bg-white rounded">
                    <h2 class="fw-bold text-primary mb-4 text-center">Abrir Novo Chamado</h2>
                    
                    <form th:action="@{/chamados}" method="POST">
                        
                        <div class="mb-3">
                            <label for="titulo" class="form-label fw-bold">Título do Chamado</label>
                            <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Ex: Erro na impressora" required>
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label fw-bold">Descrição do Problema</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Descreva detalhadamente..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="prioridade" class="form-label fw-bold">Prioridade</label>
                            <select class="form-select" id="prioridade" name="prioridade" required>
                                <option value="" disabled selected>Selecione a prioridade</option>
                                <option value="BAIXA">Baixa</option>
                                <option value="MEDIA">Média</option>
                                <option value="ALTA">Alta</option>
                                <option value="CRITICA">Crítica</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="clienteId" class="form-label fw-bold">Cliente</label>
                            <select class="form-select" id="clienteId" name="clienteId" required>
                                <option value="" disabled selected>Selecione o cliente</option>
                                <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="categoriaId" class="form-label fw-bold">Categoria</label>
                            <select class="form-select" id="categoriaId" name="categoriaId" required>
                                <option value="" disabled selected>Selecione a categoria</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="tecnicoId" class="form-label fw-bold">Técnico Responsável</label>
                            <select class="form-select" id="tecnicoId" name="tecnicoId" required>
                                <option value="" disabled selected>Selecione o técnico</option>
                                <option th:each="tec : ${tecnicos}" th:value="${tec.id}" th:text="${tec.nome}"></option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/chamados" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">Salvar Chamado</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

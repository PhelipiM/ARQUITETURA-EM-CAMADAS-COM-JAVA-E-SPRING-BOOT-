<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary">Lista de Chamados</h2>
            <div>
                <a href="/" class="btn btn-outline-secondary me-2">Voltar ao Início</a>
                <a href="/chamados/novo" class="btn btn-primary">+ Novo Chamado</a>
            </div>
        </div>

        <div class="card shadow-sm p-4 bg-white rounded">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Descrição</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="chamado : ${listaChamados}">
                        <td th:text="${chamado.id}">1</td>
                        <td th:text="${chamado.titulo}">Exemplo de Título</td>
                        <td th:text="${chamado.descricao}">Exemplo de Descrição do problema</td>
                        <td>
                            <span class="badge bg-success">Ativo</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaChamados)}">
                        <td colspan="4" class="text-center text-muted py-4">Nenhum chamado registado de momento.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
